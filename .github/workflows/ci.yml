name: CI

on:
  push:
    branches: ["master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install (dev)
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"

      - name: Download OpenAPI specs
        run: |
          make download-specs

      - name: Verify spec lock (sha256)
        run: |
          make verify-spec-lock

      - name: Generate clients
        run: |
          make generate-all

      - name: Check (lint + typecheck + tests)
        run: |
          make check
