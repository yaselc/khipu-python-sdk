name: CI

on:
  push:
    branches: ["master"]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly upstream spec drift watch (see the spec-drift job).
    - cron: "0 6 * * 1"

permissions:
  contents: read

# Every job runs on an explicit runner image and every action is pinned to a
# full commit SHA (version in the trailing comment), in all four workflows, so
# neither a moved tag nor a relabelled `ubuntu-latest` changes what CI or a
# release runs. Updating either is a reviewed change (#37).
jobs:
  check:
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install (dev)
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"

      # No download here on purpose. `make download-specs` overwrites the
      # committed specs with whatever docs.khipu.com serves today, so verifying
      # the lock afterwards checks upstream against the pin instead of checking
      # that this repository is internally reproducible -- and turns any Khipu
      # documentation edit into a red build on unrelated PRs. Upstream drift is
      # watched by the non-blocking `spec-drift` job below.
      - name: Verify spec lock (sha256) against the committed specs
        run: |
          make verify-spec-lock

      - name: Generate clients
        run: |
          make generate-all

      # khipu_sdk/_generated/ is committed and shipped in the wheel, so it must
      # be exactly what the pipeline produces -- including the Instant Payments
      # compatibility overlay (tools/spec_compat.py, #15). A hand edit, or a
      # regeneration that bypassed the overlay, fails here. The path must be
      # the directory `make generate-all` writes (GENERATED_DIR in the
      # Makefile): on any other path this check passes vacuously (#56).
      # tests/unit/test_generated_namespace.py pins it.
      - name: Committed khipu_sdk/_generated/ matches a fresh regeneration
        run: |
          if [ -n "$(git status --porcelain -- khipu_sdk/_generated/)" ]; then
            git status --short -- khipu_sdk/_generated/
            git diff -- khipu_sdk/_generated/
            exit 1
          fi

      - name: Check (lint + typecheck + tests)
        run: |
          make check

  package:
    # Regression guard for packaging: the `check` job regenerates the clients and
    # tests the source tree, so it cannot detect a wheel that omits the generated
    # clients under khipu_sdk/_generated/.
    # This job builds the distributions from the committed tree and exercises
    # the facade from a clean install, with no network access to Khipu.
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build tooling
        run: |
          python -m pip install -U pip build twine

      # Builds the sdist and the wheel from it, runs tools/check_dist.py (the
      # wheel mirrors khipu_sdk/ file for file, ships py.typed, installs
      # khipu_sdk as its only top-level package, and neither artifact ships
      # anything outside its allowlist), then
      # installs each artifact into a clean venv and smoke tests it. The
      # publish workflows run the same target before uploading anything.
      - name: Build, inspect and smoke-test wheel + sdist
        run: |
          make smoke-dist

      - name: Validate metadata as (Test)PyPI will
        run: |
          python -m twine check --strict dist/*

  spec-drift:
    # Non-blocking watch on Khipu's published specs. Adopting a new spec is a
    # deliberate change (re-download, `make lock-specs`, `make generate-all`,
    # review the generated diff, adjust the facade if needed), so drift is
    # reported here rather than blocking the build.
    runs-on: ubuntu-24.04
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Compare the published specs against the lock
        run: |
          make download-specs
          if git diff --quiet -- openapi/; then
            echo "Published specs are identical to the committed ones."
          else
            echo "::warning title=Khipu OpenAPI spec drift::docs.khipu.com now publishes specs that differ from the committed ones. Review before adopting."
            echo "::group::Changes vs committed specs"
            git diff --stat -- openapi/
            git diff -- openapi/
            echo "::endgroup::"
          fi
          overlay=0
          if ! make check-spec-compat; then
            echo "::warning title=Khipu OpenAPI compatibility overlay::The published Instant Payments spec no longer matches what tools/spec_compat.py expects. If Khipu now declares direct_debit, delete the #15 overlay entry when adopting the spec."
            overlay=1
          fi
          make verify-spec-lock
          exit "$overlay"
