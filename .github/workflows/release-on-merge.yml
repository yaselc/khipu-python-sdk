name: Release on merge to master

on:
  push:
    branches: ["master"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # needed to create tags reliably

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read version from pyproject.toml
        id: version
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          data = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          version = data["project"]["version"]
          tag = f"v{version}"

          print(f"version={version}")
          print(f"tag={tag}")

          # GitHub Actions outputs
          output_path = Path(os.environ["GITHUB_OUTPUT"])
          with output_path.open("a", encoding="utf-8") as f:
              f.write(f"version={version}\n")
              f.write(f"tag={tag}\n")
          PY

      - name: Check if tag already exists
        id: tagcheck
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create git tag
        if: steps.tagcheck.outputs.exists == 'false'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Build release notes from CHANGELOG (best-effort)
        id: notes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          tag = "${{ steps.version.outputs.tag }}"
          version = "${{ steps.version.outputs.version }}"
          changelog = Path("CHANGELOG.md")

          notes = None
          if changelog.exists():
              text = changelog.read_text(encoding="utf-8")
              # Matches a section like: ## [0.1.0] - YYYY-MM-DD
              # Captures everything until next "## ["
              pattern = re.compile(rf"^## \\[{re.escape(version)}\\].*?$([\\s\\S]*?)(?=^## \\[|\\Z)", re.MULTILINE)
              m = pattern.search(text)
              if m:
                  notes = m.group(0).strip()

          if not notes:
              notes = (
                  f"Release {tag}\\n\\n"
                  "Notes:\\n"
                  "- See CHANGELOG.md for details.\\n"
              )

          Path("RELEASE_NOTES.md").write_text(notes + "\\n", encoding="utf-8")
          PY

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
