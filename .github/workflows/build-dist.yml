name: Build distribution

# Reusable: called by publish-testpypi.yml and publish-pypi.yml so both publish
# exactly the same kind of artifact, built and checked the same way. Nothing
# here uploads anything; the callers' publish jobs only ever receive the
# `python-package-distributions` artifact this job produced.

on:
  workflow_call:
    # Deliberately no input that selects what to build: this workflow always
    # builds the commit of the event that started the calling run (GITHUB_SHA,
    # the commit on the dispatched master branch or the commit the published
    # release tag points at). No caller can point it at another commit.
    inputs:
      tag:
        description: "Release tag being published (v<project.version>)."
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      # No `ref`: actions/checkout then fetches and checks out GITHUB_SHA, the
      # immutable commit of the triggering event, not a movable branch or tag.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # the master-ancestry check needs history
          persist-credentials: false

      # Only code that went through review on master may be built for any
      # index, TestPyPI included: not a side branch selected in the dispatch
      # form, nor a tag pushed on one. This check is unconditional and is the
      # first step after checkout, so nothing from the checked-out tree (pip
      # build dependencies, the Makefile, tools/*.py) runs before the commit
      # is known to be the triggering commit and to be on master.
      - name: Require the commit to be on master
        run: |
          if [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]; then
            echo "::error::Checked out $(git rev-parse HEAD), but the run is for $GITHUB_SHA; refusing to publish it."
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD origin/master; then
            echo "::error::$(git rev-parse HEAD) is not on master; refusing to publish it."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: |
          python -m pip install -U pip build twine

      # Builds the sdist and the wheel from that sdist, checks both with
      # tools/check_dist.py, and smoke-tests each from a clean virtualenv.
      - name: Build, inspect and smoke-test wheel + sdist
        run: |
          make smoke-dist

      # Tag must be exactly v<project.version>, and both Issue #18 publication
      # gates must be resolved before anything is published: LICENSE names its
      # copyright holder, and PUBLICATION_GATES.toml approves (with evidence)
      # redistribution of Khipu's specs and the generated clients. This is the
      # single check that blocks TestPyPI and PyPI alike.
      - name: Check release tag, version and license
        env:
          TAG: ${{ inputs.tag }}
        run: |
          python tools/check_dist.py dist --tag "$TAG"

      - name: Validate metadata as (Test)PyPI will
        run: |
          python -m twine check --strict dist/*

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
