                    payer_email: pagador@email.com
                    personal_identifier: 11.000.111-9
                    bank_account_number: 1120490689
                    out_of_date_conciliation: true
                    transaction_id: zwo3wqz6uulcvajt
                    custom: <xml>...</xml>
                    responsible_user_email: responsible@email.com
                    send_reminders: true
