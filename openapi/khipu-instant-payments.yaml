    receiver-post-receiver-2:
      type: object
      description: Objeto para respuesta de creación de cuenta de cobro.
      required:
        - receiver_id
        - secret
      properties:
        receiver_id:
          type: string
          description: Identificador único de la cuenta de cobro.
          example: '934568'
        secret:
          type: string
          description: >-
            Llave secreta de la cuenta de cobro, se usa para firmar todas las
            peticiones.
          example: b2025dc47a29a04592fa3c1191110370db0e208c
        api_key:
          type: string
          description: API key de la cuenta de cobro creada.
          example: d6ec59c7-e299-4704-840d-300442546982
    receiver-get-receivers:
      type: object
      description: >-
        Objeto para respuesta de listado de cuentas de cobro asociadas a un
        integrador.
      required:
        - receivers
        - total
      properties:
        total:
          type: integer
          description: Cantidad total de cuentas de cobro asociadas al integrador.
          example: 150
        receivers:
          type: array
          description: Lista de cuentas de cobro asociadas al integrador.
          items:
            type: object
            required:
              - id
              - name
              - date_created
              - disabled
              - can_collect
            properties:
              id:
                type: integer
                description: Identificador único de la cuenta de cobro.
                example: 302026
              name:
                type: string
                description: Nombre de la cuenta de cobro.
                example: Cobrador 20260311115756
              date_created:
                type: string
                format: date-time
                description: Fecha de creación de la cuenta de cobro.
                example: '2026-03-11T14:57:56Z'
              disabled:
                type: boolean
                description: Indica si la cuenta de cobro está deshabilitada.
                example: false
              can_collect:
                type: boolean
                description: Indica si la cuenta de cobro puede recibir pagos.
                example: true
    merchant-get-payment-methods:
      type: object
      required:
        - paymentMethods
      properties:
        paymentMethods:
          type: array
          minItems: 1
          description: Arreglo con métodos de pago disponibles.
          items:
            type: object
            description: Método de pago.
            required:
              - id
              - name
              - logo_url
            properties:
              id:
                type: string
                description: Identificador del medio de pago.
                example: SIMPLIFIED_TRANSFER
              name:
                type: string
                description: Nombre del medio de pago.
                example: SIMPLIFIED_TRANSFER
              logo_url:
                type: string
                description: URL del logo sugerido para mostrar.
                example: >-
                  https://s3.amazonaws.com/static.khipu.com/buttons/2015/150x50-transparent.png
