openapi: 3.1.0
info:
  license:
    name: API Pagos Instantáneos
    url: https://khipu.com
  title: API Pagos Instantáneos
  description: >-
    La API Instant Payment de Khipu (versión 3.0) permite a comerciantes
    iniciar, consultar, confirmar,  reembolsar o eliminar pagos inmediatos
    mediante transferencias bancarias en tiempo real.  Entre sus principales
    funcionalidades se encuentran: obtener la lista de bancos disponibles  con
    detalles como límites, tarifas y logos; crear un pago especificando un banco
    o dejar que el  usuario elija; confirmar o solicitar el reembolso de un pago
    mediante su ID; y predecir el estado  de un pago usando machine learning.
    Esta API maneja autenticación mediante clave secreta en el  encabezado
    x-api-key, no requiere firmas, y utiliza certificados SSL de validación
    extendida para  asegurar la comunicación
  version: v3.0
  x-logo:
    url: https://s3.amazonaws.com/static.khipu.com/2021/logo-transparent.png
    altText: Logo de Khipu
    href: https://khipu.com
servers:
  - url: https://payment-api.khipu.com
    description: Producción
security:
  - Api-Key: []
paths:
  /v3/banks:
    get:
      operationId: getBanks
      summary: Get banks
      description: >-
        Este método obtiene la lista de bancos que se pueden utilizar para pagar
        en esta cuenta de cobro.
      parameters: []
      responses:
        '200':
          description: >-
            Operación exitosa. Devuelve un objeto JSON con el conjunto de bancos
            disponibles.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/bank-get-banks'
        '400':
          description: Bad request - Solicitud mal formada
        '401':
          description: Unauthorized - Credenciales no válidas o faltantes
        '403':
          description: Forbidden - Cliente no tiene privilegios
        '404':
          description: Not found - Recurso no disponible
        '500':
          description: Internal server error - Servidor no pudo completar la solicitud
  /v3/payments/{id}/confirm:
    post:
      operationId: postPaymentConfirmById
      summary: Confirm payment by Id
      description: >
        **Advertencia: Esta función sólo está disponible para los clientes que
        la hayan contratado de forma independiente.

        Para utilizarla, póngase en contacto con nosotros en
        soporte@khipu.com**<br><br>

        Confirmar el pago. Al confirmar el pago, este será rendido al día hábil

        siguiente.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            maxLength: 255
          description: Identificador del pago
      responses:
        '200':
          description: Operación exitosa.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/success'
        '400':
          description: Bad request - Solicitud mal formada
        '401':
          description: Unauthorized - Credenciales no válidas o faltantes
        '403':
          description: Forbidden - Cliente no tiene privilegios
        '404':
          description: Not found - Recurso no disponible
        '500':
          description: Internal server error - Servidor no pudo completar la solicitud
  /v3/payments/{id}:
    get:
      operationId: getPaymentById
      summary: Get payment by Id
      description: >-
        Información completa del pago. Datos con los que fue creado y el estado
        actual del pago.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            maxLength: 255
          description: Identificador del pago
      responses:
        '200':
          description: >-
            Operación exitosa. Devuelve un objeto JSON con la información de
            pago.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/payment-get-payment'
              examples:
                pagoConDevoluciones:
                  summary: Pago con devoluciones
                  value:
                    payment_id: gqzdy6chjne9
                    payment_url: https://khipu.com/payment/info/gqzdy6chjne9
                    simplified_transfer_url: https://app.khipu.com/payment/simplified/gqzdy6chjne9
                    transfer_url: https://khipu.com/payment/manual/gqzdy6chjne9
                    app_url: khipu:///pos/gqzdy6chjne9
                    ready_for_terminal: false
                    notification_token: >-
                      9dec8aa176c5223026919b3b5579a4776923e646ff3be686b9e6b62ec042e91f
                    receiver_id: 985101
                    conciliation_date: '2017-03-01T13:00:00.000Z'
                    subject: Test
                    amount: '1000.0000'
                    currency: CLP
