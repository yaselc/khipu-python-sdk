# Publication gates (Issue #18).
#
# `tools/check_dist.py --tag`, which both publish workflows run through
# .github/workflows/build-dist.yml before anything is uploaded, refuses to
# publish to TestPyPI or PyPI unless every gate here is approved.
#
# Changing a value to `true` is an owner decision, never an inference: it is
# made in its own reviewed pull request that sets `evidence` to the Issue #18
# comment recording the decision and its basis.
#
# (The other gate, the copyright holder, is enforced on LICENSE itself: the
# template placeholder must be replaced.)

[khipu_redistribution]
# Explicit basis to redistribute Khipu's OpenAPI documents (openapi/) and the
# clients generated from them (khipu_sdk/_generated/, shipped in the wheel and
# sdist).
# Status: APPROVED (Issue #26). Khipu confirmed in writing that this project
# may host its published OpenAPI documents, generate Python clients from them,
# redistribute the generated code and publish khipu-python-sdk on GitHub and
# PyPI under MIT, as an independently maintained project that claims no
# affiliation with or endorsement by Khipu. The correspondence is kept
# privately; `evidence` is the public record of the decision in Issue #18.
approved = true
evidence = "https://github.com/parle-cl/khipu-python-sdk/issues/18#issuecomment-6159094247"
