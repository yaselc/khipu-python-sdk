[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "khipu-python-sdk"
version = "0.2.0"
description = "High-level Python SDK for Khipu Instant Payments (v3) and Automatic Payments (v1) APIs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  # Used directly by khipu_sdk and by the generated clients.
  "httpx>=0.25",
  # Required by the generated attrs models shipped under generated/.
  "attrs>=23.1",
  # Required by generated models that parse ISO-8601 timestamps (dateutil.parser.isoparse).
  "python-dateutil>=2.8",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-httpx>=0.30",
  "ruff>=0.5",
  "mypy>=1.8",
  "build>=1.0",
  "openapi-python-client>=0.20",
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
# `generated*` MUST stay here: the SDK facade is non-functional without the
# generated clients. See tools/smoke_installed.py for the regression guard.
include = ["khipu_sdk*", "generated*"]

[tool.setuptools.package-data]
khipu_sdk = ["py.typed"]
