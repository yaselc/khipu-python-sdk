[build-system]
# >=77 for PEP 639 license metadata (`license = "MIT"` + `license-files`).
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "khipu-python-sdk"
version = "0.4.0"
description = "Community-maintained, unofficial Python SDK for the Khipu Instant Payments (v3) and Automatic Payments (v1) APIs"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
# No email on purpose: none has been approved for publication. Contact goes
# through the repository (see SECURITY.md for vulnerability reports).
maintainers = [{ name = "Yasel Couce" }]
keywords = ["khipu", "payments", "chile", "openapi", "sdk"]
# Keep the Python versions in step with the CI test matrix (.github/workflows/ci.yml);
# tests/unit/test_release_metadata.py enforces it.
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Financial",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  # Used directly by khipu_sdk and by the generated clients.
  "httpx>=0.25",
  # Required by the generated attrs models shipped under generated/.
  "attrs>=23.1",
  # Required by generated models that parse ISO-8601 timestamps (dateutil.parser.isoparse).
  "python-dateutil>=2.8",
]

[project.urls]
Homepage = "https://github.com/yaselc/khipu-python-sdk"
Source = "https://github.com/yaselc/khipu-python-sdk"
Issues = "https://github.com/yaselc/khipu-python-sdk/issues"
Changelog = "https://github.com/yaselc/khipu-python-sdk/blob/master/CHANGELOG.md"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-httpx>=0.30",
  # Pinned exactly for the same reason as the generator below: ruff and mypy
  # decide whether CI passes, and their rule sets evolve by design, so a
  # floating version changes the verdict on unchanged code. Without a pin,
  # `make check` passes locally and fails in CI purely because the runner
  # resolved a newer release. Bumping either is a deliberate step: change the
  # pin and fix whatever the new rules report.
  "ruff==0.14.10",
  "mypy==1.19.1",
  "build>=1.0",
  # Pinned exactly, not with >= or ~=: the code generator is the build tool
  # that produces the committed contents of generated/, so a floating version
  # would let a generator release change that code without any change in this
  # repository. Bumping it is a deliberate maintenance step: change the pin,
  # run `make generate-all`, and review the resulting diff.
  "openapi-python-client==0.28.0",
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
# `khipu_sdk*` also picks up the generated clients under `khipu_sdk/_generated`,
# which the SDK facade cannot work without (see tools/smoke_installed.py). Do
# not add another top-level package: the wheel must ship `khipu_sdk` alone
# (#56), which tools/check_dist.py enforces.
include = ["khipu_sdk*"]

[tool.setuptools.package-data]
khipu_sdk = ["py.typed"]

[tool.ruff]
# `khipu_sdk/_generated/` is machine-produced and must never be hand-edited
# (see the regeneration workflow in the README), so linting it can only ever
# produce findings nobody is allowed to act on. Excluding it keeps the build
# from being gated on code this repository does not own.
extend-exclude = ["khipu_sdk/_generated"]

[tool.mypy]
# Same reasoning as ruff: `mypy khipu_sdk` type-checks the hand-written modules
# only, as it did while the generated clients lived outside the package. The
# facade loads them with importlib, so excluding the directory from discovery
# does not hide any hand-written code. tests/unit/test_generated_namespace.py
# pins this to exactly the generated directory.
exclude = ['^khipu_sdk/_generated/']
